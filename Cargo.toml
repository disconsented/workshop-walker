[workspace]
members = ["macros", "migrations-tool", "proc-macros", "serde-hack"]

[workspace.package]
edition = "2024"
license = "MPL-2"
version = "0.3.0"

[workspace.dependencies]

# The members inherit these. Without them `dep.workspace = true` in a member
# manifest has nothing to resolve against.
macros = { path = "./macros" }
migrations-tool = { path = "./migrations-tool" }
proc-macros = { path = "./proc-macros" }
serde-hack = { path = "./serde-hack" }

async-stream = "0.3.6"
bbscope = "0.2"
biscuit-auth = "6.0.0"
blake2 = "0.11"
chrono = "0.4"
clap = { features = ["derive"], version = "4.6" }
config = "0.15"
futures = "0.3"
humantime = "2.2"
intel-mkl-src = { version = "0.8" }
itertools = "0.15"
lingua = { features = [
  "chinese",
  "english",
  "french",
  "german",
  "japanese",
  "korean",
  "portuguese",
  "russian",
  "spanish",
], version = "1.7" }
multimap = "0.10"
paste = "1.0"
quote = "1.0"
ractor = { features = ["async-trait", "monitors"], version = "0.16" }
reqwest = { features = ["json"], version = "0.13" }
salvo = { features = [
  "affix-state",
  "concurrency-limiter",
  "cookie",
  "logging",
  "oapi",
  "rate-limiter",
  "serve-static",
  "size-limiter",
  "timeout",
], version = "0.96" }
serde = { features = ["derive"], version = "1.0" }
serde-content = "0.1"
serde-xml-rs = "0.8.1"
serde_json = "1.0"
serde_repr = "0.1"
snafu = "0.9"
surrealdb = { features = [
  "allocator",
  "kv-mem",
  "kv-rocksdb",
  "protocol-http",
  "protocol-ws",
  "rustls",
], version = "3.1" }
surrealdb-core = "3.1"
surrealdb-types = "3.1"
syn = "3.0"
tempfile = "3.27.0"
tokio = { features = ["full"], version = "1.48" }
tokio-stream = { features = ["fs"], version = "0.1" }
tracing = "0.1"
tracing-subscriber = { features = ["env-filter"], version = "0.3.19" }
veil = "0.3"

[package]
edition.workspace = true
license.workspace = true
name = "workshop-walker"
# No `publish = false` here. Cargo reads that as an empty registry list, and
# release-plz then drops the package from the release set and does nothing.
# `publish = false` in `release-plz.toml` stops the upload instead.
version.workspace = true

[dependencies]
bbscope.workspace = true
biscuit-auth.workspace = true
chrono.workspace = true
config.workspace = true
humantime.workspace = true
itertools.workspace = true
lingua = { features = [
  "chinese",
  "english",
  "french",
  "german",
  "japanese",
  "korean",
  "portuguese",
  "russian",
  "spanish",
], workspace = true }
macros.workspace = true
migrations-tool.workspace = true
multimap.workspace = true
ractor = { features = ["async-trait", "monitors"], workspace = true }
reqwest = { features = ["json", "query"], version = "0.13", workspace = true }
salvo = { features = [
  "affix-state",
  "cookie",
  "logging",
  "oapi",
  "serve-static",
  "size-limiter",
], workspace = true }
serde = { features = ["derive"], workspace = true }
serde-content.workspace = true
serde-hack.workspace = true
serde-xml-rs.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
snafu.workspace = true
surrealdb = { features = [
  "allocator",
  "kv-mem",
  "kv-rocksdb",
  "protocol-http",
  "protocol-ws",
  "rustls",
], workspace = true }
surrealdb-core.workspace = true
surrealdb-types.workspace = true
tokio = { features = [
  "fs",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
], workspace = true }
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber = { features = ["env-filter"], workspace = true }
veil.workspace = true

[features]

[profile.release]
lto = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
allow-dbg-in-tests = { level = "allow", priority = 9 }
complexity = { level = "warn", priority = 7 }
correctness = { level = "deny", priority = 6 }
dbg_macro = { level = "deny", priority = 8 }
lint_groups_priority = { level = "allow", priority = 0 }
pedantic = { level = "deny", priority = 5 }
perf = { level = "deny", priority = 4 }
pub_with_shorthand = { level = "allow", priority = 10 }
style = { level = "deny", priority = 2 }
suspicious = { level = "deny", priority = 1 }

[target.x86_64-unknown-linux-gnu]
rustflags = "-C target-cpu=x86-64-v3"
