[workspace]
allow_dirty = true # allow updating repositories with uncommitted changes
changelog_update = false # disable changelog updates
dependencies_update = true # update dependencies with `cargo update`
git_release_enable = false # disable GitHub/Gitea releases
pr_branch_prefix = "release-plz-" # PR branch prefix
pr_labels = ["release"] # add the `release` label to the release Pull Request
publish = false # nothing in this workspace goes to a cargo registry
release = false # every member inherits one `workspace.package.version`, so only
# `workshop-walker` below is released; releasing each member separately would
# create one tag per crate for what is really a single version.
release_always = false # tag and make the release when the release PR merges.
# Without this the release job tags every push whose version has no tag yet,
# which would tag master before the release PR that prepares it can merge.
semver_check = false # disable API breaking changes checks
release_commits = "^feat(\\(.+\\))?!?:" # prepare a release only when a feature
# lands. The scope group matters: every feature commit in this repo is scoped,
# such as `feat(search):`, so a plain `^feat:` matches none of them.

[[package]] # the double square brackets define a TOML table array
name = "workshop-walker"
release = true # the one crate that is released, standing in for the workspace
# No `git_only` here. That mode reads the last version from the git tags, which
# is what this workspace needs, but it also runs `cargo package --workspace` on
# a worktree of the tag. That command fails here because the internal path
# dependencies, such as `proc-macros`, are not on crates.io, and cargo demands a
# registry match for every path dependency it packages. See release-plz issue
# 2595. `.github/workflows/release.yml` gives release-plz the manifest of the
# last tag with `--registry-manifest-path` instead, which answers the same
# question and runs no build.
git_tag_name = "v{{version}}" # match the existing `v0.1.0` tags. release-plz
# otherwise defaults to `{{package}}-v{{version}}` in a workspace, which matches
# none of the tags in this repo. Every crate then looks unreleased and the
# release PR bumps nothing.
changelog_path = "CHANGELOG.md"
changelog_update = true
git_release_enable = true # make the GitHub release
publish = false # never run `cargo publish`
